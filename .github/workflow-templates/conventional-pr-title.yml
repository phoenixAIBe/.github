name: Conventional PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|chore|refactor|perf|docs|test|ci|build|revert)(\([a-z0-9._/-]+\))?!?: .+'

          if ! printf '%s' "$TITLE" | grep -qE "$PATTERN"; then
            echo "::error::Pull request title does not follow Conventional Commits."
            echo "Title:    $TITLE"
            echo "Expected: <type>(<optional scope>): <description>"
            echo "Types:    feat, fix, chore, refactor, perf, docs, test, ci, build, revert"
            echo "Example:  fix(media-api): stop holding the transaction open while streaming"
            exit 1
          fi

          SUBJECT="${TITLE#*: }"

          if [ "${SUBJECT%.}" != "$SUBJECT" ]; then
            echo "::error::Description must not end with a period."
            exit 1
          fi

          if [ "${#SUBJECT}" -gt 72 ]; then
            echo "::error::Description is ${#SUBJECT} characters; keep it to 72 or fewer."
            exit 1
          fi

          echo "Title follows Conventional Commits."
