name: Conventional PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: conventional-pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-pr-title:
    name: Conventional Commits
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Validate pull request title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        run: |
          # Read the title from the API rather than from the event payload.
          # Re-running a workflow replays the original payload, so a title that
          # was fixed after the first failure would never be re-read.
          TITLE=$(curl -sS --fail --retry 3 --retry-connrefused \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$PR_URL" | jq -r '.title')

          echo "Validating: $TITLE"

          printf 'extends:\n  - "@commitlint/config-conventional"\n' > "$RUNNER_TEMP/commitlintrc.yml"
          printf '%s' "$TITLE" | docker run --rm -i \
            -v "$RUNNER_TEMP/commitlintrc.yml":/commitlintrc.yml:ro \
            commitlint/commitlint:21.2.2 --config /commitlintrc.yml
